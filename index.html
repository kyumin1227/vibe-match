<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>성격 나침반 / 性格コンパス</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #132a22;
        --forest-deep: #0b1d16;
        --cream: #f3efe3;
        --cream-dim: #cfc9b8;
        --brass: #d4a94c;
        --brass-soft: #e8c87a;
        --coral: #c8694f;
        --line: rgba(243, 239, 227, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(212, 169, 76, 0.1), transparent 60%),
          radial-gradient(900px 500px at 110% 10%, rgba(200, 105, 79, 0.08), transparent 55%), var(--forest);
        color: var(--cream);
        font-family: "IBM Plex Sans KR", "Noto Sans JP", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .stage {
        width: 100%;
        max-width: 640px;
      }

      .lang-switch {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 14px;
      }
      .lang-btn {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        background: transparent;
        color: var(--cream-dim);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .lang-btn.active {
        background: var(--brass);
        color: var(--forest-deep);
        border-color: var(--brass);
        font-weight: 600;
      }
      .lang-btn:hover:not(.active) {
        border-color: var(--brass);
        color: var(--cream);
      }

      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        color: var(--brass-soft);
        text-transform: uppercase;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .eyebrow::before {
        content: "";
        width: 18px;
        height: 1px;
        background: var(--brass);
        display: inline-block;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 34px;
        line-height: 1.15;
        margin: 0 0 14px 0;
        letter-spacing: -0.01em;
      }
      p.lead {
        color: var(--cream-dim);
        font-size: 15px;
        line-height: 1.7;
        margin: 0 0 26px 0;
      }
      .card {
        background: linear-gradient(180deg, rgba(243, 239, 227, 0.05), rgba(243, 239, 227, 0.02));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 34px;
        backdrop-filter: blur(2px);
      }
      .compass {
        display: flex;
        justify-content: center;
        margin-bottom: 22px;
      }
      .btn {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: var(--brass);
        color: var(--forest-deep);
        border: none;
        border-radius: 999px;
        padding: 14px 28px;
        cursor: pointer;
        font-weight: 600;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .btn:hover {
        background: var(--brass-soft);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
      }
      .btn.ghost {
        background: transparent;
        color: var(--cream);
        border: 1px solid var(--line);
      }
      .btn.ghost:hover {
        background: rgba(243, 239, 227, 0.06);
      }
      .btn.block {
        width: 100%;
      }
      .btn-row {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 28px;
      }

      .progress-wrap {
        display: flex;
        gap: 8px;
        margin-bottom: 26px;
      }
      .progress-seg {
        flex: 1;
        height: 4px;
        border-radius: 4px;
        background: rgba(243, 239, 227, 0.12);
        overflow: hidden;
      }
      .progress-seg > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--brass);
        transition: width 0.35s ease;
      }
      .progress-meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--cream-dim);
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .q-trait-tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--brass-soft);
        text-transform: uppercase;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .q-text {
        font-family: "Fraunces", serif;
        font-size: 23px;
        line-height: 1.45;
        margin: 0 0 26px 0;
        min-height: 100px;
      }
      .scale {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .scale-btn {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(243, 239, 227, 0.02);
        cursor: pointer;
        color: var(--cream);
        font-size: 14.5px;
        text-align: left;
        transition: all 0.15s ease;
      }
      .scale-btn .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--cream-dim);
        flex-shrink: 0;
      }
      .scale-btn:hover {
        border-color: var(--brass);
        background: rgba(212, 169, 76, 0.06);
      }
      .scale-btn.selected {
        border-color: var(--brass);
        background: rgba(212, 169, 76, 0.14);
      }
      .scale-btn.selected .dot {
        border-color: var(--brass);
        background: var(--brass);
      }

      .result-title {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 25px;
        text-align: center;
        margin: 4px 0 6px 0;
        color: var(--brass-soft);
      }
      .result-sub {
        text-align: center;
        color: var(--cream-dim);
        font-size: 13px;
        margin-bottom: 28px;
        font-family: "IBM Plex Mono", monospace;
        letter-spacing: 0.04em;
      }
      .trait-block {
        margin-bottom: 24px;
      }
      .trait-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }
      .trait-head .name {
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .trait-head .pct {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: var(--brass-soft);
      }
      .trait-bar {
        height: 8px;
        border-radius: 8px;
        background: rgba(243, 239, 227, 0.1);
        overflow: hidden;
        margin-bottom: 8px;
      }
      .trait-bar > div {
        height: 100%;
        background: linear-gradient(90deg, var(--brass), var(--coral));
      }
      .trait-desc {
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--cream-dim);
      }

      .disclaimer {
        font-size: 12px;
        color: var(--cream-dim);
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 24px;
        line-height: 1.6;
      }
      .hidden {
        display: none !important;
      }

      /* ---- room flow ---- */
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--cream-dim);
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        margin: 22px 0;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .code-input-row {
        display: flex;
        gap: 10px;
      }
      .code-input {
        flex: 1;
        min-width: 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.2em;
        text-align: center;
        background: rgba(243, 239, 227, 0.04);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--cream);
        padding: 12px;
      }
      .code-input:focus {
        outline: none;
        border-color: var(--brass);
      }
      #nickname-input {
        font-family: "IBM Plex Sans KR", "Noto Sans JP", sans-serif;
        font-size: 14px;
        letter-spacing: normal;
        text-align: left;
      }
      .status-msg {
        font-size: 12.5px;
        text-align: center;
        min-height: 18px;
        margin-top: 12px;
      }
      .status-msg.err {
        color: var(--coral);
      }
      .status-msg.info {
        color: var(--cream-dim);
      }

      .room-code-display {
        font-family: "IBM Plex Mono", monospace;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-align: center;
        color: var(--brass-soft);
        margin: 4px 0 2px 0;
      }
      .lobby-sub {
        text-align: center;
        color: var(--cream-dim);
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
        margin-bottom: 18px;
      }
      .lobby-desc {
        color: var(--cream-dim);
        font-size: 13.5px;
        line-height: 1.6;
        text-align: center;
        margin: 0 0 26px 0;
      }
      .stack-row {
        display: flex;
        gap: 10px;
      }
      .stack-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .match-section {
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .match-section h3 {
        font-family: "Fraunces", serif;
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 12px 0;
        color: var(--brass-soft);
      }
      .match-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .match-item .sim {
        font-family: "IBM Plex Mono", monospace;
        color: var(--brass-soft);
        font-size: 13px;
      }
      .match-item.opposite {
        border-color: rgba(200, 105, 79, 0.4);
        background: rgba(200, 105, 79, 0.06);
      }
      .match-item.opposite .sim {
        color: var(--coral);
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 27px;
        }
        .card {
          padding: 24px;
        }
        .q-text {
          font-size: 19px;
          min-height: 80px;
        }
        .room-code-display {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="lang-switch">
        <button class="lang-btn" id="lang-ko" onclick="setLang('ko')">한국어</button>
        <button class="lang-btn" id="lang-ja" onclick="setLang('ja')">日本語</button>
      </div>

      <!-- HOME -->
      <div id="screen-home">
        <div class="eyebrow" id="t-eyebrow-home"></div>
        <h1 id="t-title"></h1>
        <p class="lead" id="t-lead"></p>
        <div class="card">
          <div class="compass">
            <svg viewBox="0 0 120 120" width="120" height="120" fill="none">
              <circle cx="60" cy="60" r="56" stroke="#D4A94C" stroke-opacity="0.35" stroke-width="1" />
              <circle cx="60" cy="60" r="38" stroke="#D4A94C" stroke-opacity="0.5" stroke-width="1" />
              <line x1="60" y1="6" x2="60" y2="114" stroke="#D4A94C" stroke-opacity="0.3" stroke-width="1" />
              <line x1="6" y1="60" x2="114" y2="60" stroke="#D4A94C" stroke-opacity="0.3" stroke-width="1" />
              <polygon points="60,20 66,60 60,100 54,60" fill="#D4A94C" />
              <circle cx="60" cy="60" r="5" fill="#F3EFE3" />
            </svg>
          </div>
          <input class="code-input" id="nickname-input" maxlength="12" style="width: 100%; margin-bottom: 14px" />
          <button class="btn block" id="t-create-btn" onclick="createRoom()"></button>
          <div class="divider" id="t-divider"></div>
          <div class="code-input-row">
            <input class="code-input" id="code-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" />
            <button class="btn ghost" id="t-join-btn" onclick="joinRoomByCode()"></button>
          </div>
          <div class="status-msg err" id="home-status"></div>
        </div>
      </div>

      <!-- LOBBY -->
      <div id="screen-lobby" class="hidden">
        <div class="eyebrow" id="t-eyebrow-lobby"></div>
        <div class="card">
          <div class="room-code-display" id="lobby-code"></div>
          <div class="lobby-sub" id="lobby-codename"></div>
          <div class="lobby-desc" id="lobby-desc"></div>
          <div class="stack-col">
            <button class="btn block" id="t-start-test-btn" onclick="beginQuiz()"></button>
            <button class="btn ghost block" id="t-copy-code-btn" onclick="copyRoomCode()"></button>
            <button class="btn ghost block" id="t-back-home-1" onclick="goHome()"></button>
          </div>
          <div class="status-msg info" id="lobby-status"></div>
        </div>
      </div>

      <!-- QUIZ -->
      <div id="screen-quiz" class="hidden">
        <div class="progress-meta">
          <span id="q-counter">1 / 30</span>
          <span id="q-trait-label"></span>
        </div>
        <div class="progress-wrap">
          <div class="progress-seg"><i id="prog-E"></i></div>
          <div class="progress-seg"><i id="prog-A"></i></div>
          <div class="progress-seg"><i id="prog-C"></i></div>
          <div class="progress-seg"><i id="prog-N"></i></div>
          <div class="progress-seg"><i id="prog-O"></i></div>
        </div>
        <div class="card">
          <div class="q-trait-tag"><span id="q-icon">🎉</span><span id="q-trait-name"></span></div>
          <div class="q-text" id="q-text"></div>
          <div class="scale" id="scale"></div>
          <div class="btn-row">
            <button class="btn ghost" id="btn-prev" onclick="prevQuestion()"></button>
            <button class="btn" id="btn-next" onclick="nextQuestion()" disabled></button>
          </div>
        </div>
      </div>

      <!-- WAIT (submitted, waiting on host to close / or host closes here) -->
      <div id="screen-wait" class="hidden">
        <div class="eyebrow" id="t-eyebrow-wait"></div>
        <div class="card">
          <div class="result-title" id="wait-title"></div>
          <div class="lobby-desc" id="wait-desc"></div>
          <div class="stack-col">
            <button class="btn block" id="t-close-room-btn" onclick="closeRoomAndFetchResults()"></button>
            <button class="btn ghost block" id="t-check-result-btn" onclick="checkResults()"></button>
          </div>
          <div class="status-msg info" id="wait-status"></div>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="screen-result" class="hidden">
        <div class="eyebrow" id="t-eyebrow-result"></div>
        <div class="card">
          <div class="compass">
            <svg viewBox="0 0 120 120" width="100" height="100" fill="none">
              <circle cx="60" cy="60" r="56" stroke="#D4A94C" stroke-opacity="0.35" stroke-width="1" />
              <circle cx="60" cy="60" r="38" stroke="#D4A94C" stroke-opacity="0.5" stroke-width="1" />
              <polygon points="60,20 66,60 60,100 54,60" fill="#D4A94C" />
              <circle cx="60" cy="60" r="5" fill="#F3EFE3" />
            </svg>
          </div>
          <div class="result-title" id="result-title"></div>
          <div class="result-sub" id="result-sub"></div>

          <div id="trait-blocks"></div>

          <div id="match-section" class="match-section hidden">
            <h3 id="t-top-matches-title"></h3>
            <div id="top-matches-list"></div>
            <h3 id="t-opposite-title" style="margin-top: 18px"></h3>
            <div id="opposite-item"></div>
          </div>

          <div style="text-align: center; margin-top: 18px">
            <button class="btn ghost" id="t-restart-btn" onclick="goHome()"></button>
          </div>

          <div class="disclaimer" id="t-disclaimer"></div>
        </div>
      </div>
    </div>

      const traitOrder = ["E", "A", "C", "N", "O"];
      let lang = "ko";

      // 문항 목록을 언어별로 만들어두되, 순서/축(trait)은 공유
      function buildQuestions() {
        const qs = [];
        traitOrder.forEach((tr) => {
          i18n[lang].questions[tr].forEach((text) => qs.push({ trait: tr, text }));
        });
        return qs;
      }
      let questions = buildQuestions();

      // ---------- 방/참가자 상태 ----------
      const SESSION_KEY = "chemistryRoomSession";
      const session = {
        roomCode: null,
        hostToken: null,
        participantId: null,
        codename: null,
        isHost: false,
        submitted: false,
      };

      function saveSession() {
        try {
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        } catch (e) {
          /* noop */
        }
      }

      function loadSession() {
        try {
          const raw = localStorage.getItem(SESSION_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function clearSession() {
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {
          /* noop */
        }
      }

      let current = 0;
      let answers = new Array(questions.length).fill(null);

      function showScreen(id) {
        ["screen-home", "screen-lobby", "screen-quiz", "screen-wait", "screen-result"].forEach((sid) => {
          document.getElementById(sid).classList.toggle("hidden", sid !== id);
        });
      }

      function currentScreenId() {
        return ["screen-home", "screen-lobby", "screen-quiz", "screen-wait", "screen-result"].find(
          (sid) => !document.getElementById(sid).classList.contains("hidden"),
        );
      }

      async function apiCall(path, options) {
        let res;
        try {
          res = await fetch(API_BASE + path, options);
        } catch (e) {
          throw new Error(i18n[lang].networkError);
        }
        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          /* noop */
        }
        if (!res.ok) {
          const err = new Error(data.error || i18n[lang].networkError);
          err.status = res.status;
          throw err;
        }
        return data;
      }

      function setBtnBusy(btn, busy) {
        if (!btn) return;
        btn.disabled = busy;
      }

      // ---------- HOME ----------
      function joinRoomRequest(code) {
        const nickname = document.getElementById("nickname-input").value.trim();
        return apiCall(`/rooms/${code}/join`, {
          method: "POST",
          body: JSON.stringify({ nickname }),
        });
      }

      async function createRoom() {
        const btn = document.getElementById("t-create-btn");
        setBtnBusy(btn, true);
        setText("home-status", "");
        try {
          const data = await apiCall("/rooms", { method: "POST" });
          session.hostToken = data.hostToken;
          session.isHost = true;
          const joinData = await joinRoomRequest(data.code);
          session.roomCode = data.code;
          session.participantId = joinData.participantId;
          session.codename = joinData.codename;
          saveSession();
          showLobby();
        } catch (e) {
          setText("home-status", e.message);
        } finally {
          setBtnBusy(btn, false);
        }
      }

      async function joinRoomByCode() {
        const btn = document.getElementById("t-join-btn");
        const raw = document.getElementById("code-input").value.trim().replace(/\D/g, "");
        if (raw.length !== 6) {
          setText("home-status", i18n[lang].codeInvalid);
          return;
        }
        setBtnBusy(btn, true);
        setText("home-status", "");
        try {
          const joinData = await joinRoomRequest(raw);
          session.roomCode = raw;
          session.hostToken = null;
          session.isHost = false;
          session.participantId = joinData.participantId;
          session.codename = joinData.codename;
          saveSession();
          showLobby();
        } catch (e) {
          setText("home-status", e.message);
        } finally {
          setBtnBusy(btn, false);
        }
      }

      function goHome() {
        session.roomCode = null;
        session.hostToken = null;
        session.participantId = null;
        session.codename = null;
        session.isHost = false;
        session.submitted = false;
        clearSession();
        current = 0;
        answers = new Array(questions.length).fill(null);
        document.getElementById("code-input").value = "";
        document.getElementById("nickname-input").value = "";
        setText("home-status", "");
        showScreen("screen-home");
      }

      // ---------- LOBBY ----------
      function showLobby() {
        const t = i18n[lang];
        document.getElementById("lobby-code").textContent = session.roomCode;
        document.getElementById("lobby-codename").textContent = t.lobbyCodenamePrefix + session.codename;
        document.getElementById("lobby-desc").textContent = session.isHost ? t.lobbyDescHost : t.lobbyDescGuest;
        setText("lobby-status", "");
        showScreen("screen-lobby");
      }

      function copyRoomCode() {
        const code = session.roomCode || "";
        const done = () => setText("lobby-status", i18n[lang].copiedMsg);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done).catch(done);
        } else {
          done();
        }
      }

      function beginQuiz() {
        current = 0;
        answers = new Array(questions.length).fill(null);
        showScreen("screen-quiz");
        renderQuestion();
      }

      // ---------- QUIZ ----------
      function renderQuestion() {
        const t = i18n[lang];
        const q = questions[current];
        const meta = t.traitMeta[q.trait];
        document.getElementById("q-counter").textContent = current + 1 + " / " + questions.length;
        document.getElementById("q-trait-label").textContent = meta.name;
        document.getElementById("q-icon").textContent = meta.icon;
        document.getElementById("q-trait-name").textContent = meta.name;
        document.getElementById("q-text").textContent = q.text;

        const scale = document.getElementById("scale");
        scale.innerHTML = "";
        t.scaleLabels.forEach((label, i) => {
          const val = i + 1;
          const btn = document.createElement("div");
          btn.className = "scale-btn" + (answers[current] === val ? " selected" : "");
          btn.innerHTML = '<span class="dot"></span><span>' + label + "</span>";
          btn.onclick = () => selectAnswer(val);
          scale.appendChild(btn);
        });

        document.getElementById("btn-prev").style.visibility = current === 0 ? "hidden" : "visible";
        document.getElementById("btn-next").disabled = answers[current] === null;
        document.getElementById("btn-next").textContent = current === questions.length - 1 ? t.resultBtn : t.nextBtn;

        updateProgress();
      }

      function selectAnswer(val) {
        answers[current] = val;
        renderQuestion();
      }

      function updateProgress() {
        const counts = { E: 0, A: 0, C: 0, N: 0, O: 0 };
        const totals = { E: 0, A: 0, C: 0, N: 0, O: 0 };
        questions.forEach((q, i) => {
          totals[q.trait]++;
          if (answers[i] !== null) counts[q.trait]++;
        });
        traitOrder.forEach((tr) => {
          const pct = totals[tr] ? (counts[tr] / totals[tr]) * 100 : 0;
          document.getElementById("prog-" + tr).style.width = pct + "%";
        });
      }

      function nextQuestion() {
        if (answers[current] === null) return;
        if (current === questions.length - 1) {
          submitQuizAnswers();
          return;
        }
        current++;
        renderQuestion();
      }

      function prevQuestion() {
        if (current === 0) return;
        current--;
        renderQuestion();
      }

      // ---------- SUBMIT / WAIT ----------
      async function submitQuizAnswers() {
        const btn = document.getElementById("btn-next");
        setBtnBusy(btn, true);
        try {
          await apiCall(`/rooms/${session.roomCode}/answers`, {
            method: "POST",
            body: JSON.stringify({ participantId: session.participantId, answers }),
          });
          session.submitted = true;
          saveSession();
          showWaitScreen();
        } catch (e) {
          alert(e.message);
        } finally {
          setBtnBusy(btn, false);
        }
      }

      function showWaitScreen() {
        const t = i18n[lang];
        document.getElementById("wait-title").textContent = t.waitTitle;
        document.getElementById("wait-desc").textContent = session.isHost ? t.waitDescHost : t.waitDescGuest;
        document.getElementById("t-close-room-btn").classList.toggle("hidden", !session.isHost);
        document.getElementById("t-check-result-btn").classList.toggle("hidden", session.isHost);
        setText("wait-status", "");
        showScreen("screen-wait");
      }

      async function closeRoomAndFetchResults() {
        const btn = document.getElementById("t-close-room-btn");
        setBtnBusy(btn, true);
        setText("wait-status", "");
        try {
          const status = await apiCall(`/rooms/${session.roomCode}/status`, { method: "GET" });
          if (status.pendingCount > 0) {
            const t = i18n[lang];
            const names = status.pendingCodenames.join(", ");
            const msg = t.pendingWarn.replace("{n}", status.pendingCount).replace("{names}", names);
            if (!confirm(msg)) {
              setBtnBusy(btn, false);
              return;
            }
          }
          await apiCall(`/rooms/${session.roomCode}/close`, {
            method: "POST",
            body: JSON.stringify({ hostToken: session.hostToken }),
          });
          await fetchAndShowResults();
        } catch (e) {
          setText("wait-status", e.message);
        } finally {
          setBtnBusy(btn, false);
        }
      }

      async function checkResults() {
        const btn = document.getElementById("t-check-result-btn");
        setBtnBusy(btn, true);
        setText("wait-status", "");
        try {
          await fetchAndShowResults();
        } catch (e) {
          setText("wait-status", e.message);
        } finally {
          setBtnBusy(btn, false);
        }
      }

      async function fetchAndShowResults() {
        let data;
        try {
          data = await apiCall(`/rooms/${session.roomCode}/results/${session.participantId}`, { method: "GET" });
        } catch (e) {
          if (e.status === 409) {
            setText("wait-status", i18n[lang].notClosedMsg);
            return;
          }
          throw e;
        }
        renderResultScreen(data);
        showScreen("screen-result");
      }

      // ---------- RESULTS ----------
      function levelOf(pct) {
        if (pct < 34) return "low";
        if (pct < 67) return "mid";
        return "high";
      }

      let lastResultData = null;

      function renderResultScreen(data) {
        lastResultData = data;
        const t = i18n[lang];
        const scores = data.scores || {};

        const results = traitOrder.map((tr) => {
          const pct = scores[tr] || 0;
          const level = levelOf(pct);
          return { trait: tr, meta: t.traitMeta[tr], pct, level, desc: t.traitDesc[tr][level] };
        });

        const sorted = [...results].sort((a, b) => Math.abs(b.pct - 50) - Math.abs(a.pct - 50));
        const top = sorted[0];
        const suffix = top.level === "high" ? t.high : top.level === "low" ? t.low : t.midSuffix;
        document.getElementById("result-title").textContent = top.meta.name + " " + suffix;
        document.getElementById("result-sub").textContent =
          results.map((r) => r.meta.icon).join(" ") + "  ·  " + t.resultSubSuffix;

        const wrap = document.getElementById("trait-blocks");
        wrap.innerHTML = "";
        results.forEach((r) => {
          const block = document.createElement("div");
          block.className = "trait-block";
          block.innerHTML = `
      <div class="trait-head">
        <span class="name">${r.meta.icon} ${r.meta.name} <span style="color:var(--cream-dim); font-weight:400;">(${t.levelLabel[r.level]})</span></span>
        <span class="pct">${r.pct}%</span>
      </div>
      <div class="trait-bar"><div style="width:${r.pct}%"></div></div>
      <div class="trait-desc">${r.desc}</div>
    `;
          wrap.appendChild(block);
        });

        const matchSection = document.getElementById("match-section");
        const topMatches = data.topMatches || [];
        const opposite = data.opposite || null;

        if (topMatches.length === 0 && !opposite) {
          matchSection.classList.add("hidden");
        } else {
          matchSection.classList.remove("hidden");
          const list = document.getElementById("top-matches-list");
          list.innerHTML = "";
          if (topMatches.length === 0) {
            list.innerHTML = `<div class="status-msg info">${t.noMatches}</div>`;
          } else {
            topMatches.forEach((m) => {
              const item = document.createElement("div");
              item.className = "match-item";
              item.innerHTML = `<span>${m.codename}</span><span class="sim">${m.similarity}${t.similaritySuffix}</span>`;
              list.appendChild(item);
            });
          }
          const oppWrap = document.getElementById("opposite-item");
          oppWrap.innerHTML = "";
          if (opposite) {
            const item = document.createElement("div");
            item.className = "match-item opposite";
            item.innerHTML = `<span>${opposite.codename}</span><span class="sim">${opposite.similarity}${t.similaritySuffix}</span>`;
            oppWrap.appendChild(item);
          }
        }
      }

      // ---------- 언어 전환 ----------
      function setText(id, text) {
        document.getElementById(id).textContent = text;
      }

      function setLang(newLang) {
        lang = newLang;
        questions = buildQuestions();
        document.getElementById("lang-ko").classList.toggle("active", lang === "ko");
        document.getElementById("lang-ja").classList.toggle("active", lang === "ja");
        renderStaticText();

        const screen = currentScreenId();
        if (screen === "screen-lobby") showLobby();
        if (screen === "screen-quiz") renderQuestion();
        if (screen === "screen-wait") showWaitScreen();
        if (screen === "screen-result" && lastResultData) renderResultScreen(lastResultData);
      }

      function renderStaticText() {
        const t = i18n[lang];
        document.getElementById("t-eyebrow-home").textContent = t.eyebrowHome;
        document.getElementById("t-title").innerHTML = t.title;
        document.getElementById("t-lead").textContent = t.lead;
        document.getElementById("nickname-input").placeholder = t.nicknamePlaceholder;
        document.getElementById("t-create-btn").textContent = t.createBtn;
        document.getElementById("t-divider").textContent = t.divider;
        document.getElementById("code-input").placeholder = t.codePlaceholder;
        document.getElementById("t-join-btn").textContent = t.joinBtn;

        document.getElementById("t-eyebrow-lobby").textContent = t.eyebrowLobby;
        document.getElementById("t-start-test-btn").textContent = t.startTestBtn;
        document.getElementById("t-copy-code-btn").textContent = t.copyCodeBtn;
        document.getElementById("t-back-home-1").textContent = t.backHomeBtn;

        document.getElementById("btn-prev").textContent = t.prevBtn;

        document.getElementById("t-eyebrow-wait").textContent = t.eyebrowWait;
        document.getElementById("t-close-room-btn").textContent = t.closeRoomBtn;
        document.getElementById("t-check-result-btn").textContent = t.checkResultBtn;

        document.getElementById("t-eyebrow-result").textContent = t.eyebrowResult;
        document.getElementById("t-restart-btn").textContent = t.restartBtn;
        document.getElementById("t-disclaimer").textContent = t.disclaimer;
        document.getElementById("t-top-matches-title").textContent = t.topMatchesTitle;
        document.getElementById("t-opposite-title").textContent = t.oppositeTitle;
      }

      // ---------- 새로고침 후 세션 복원 ----------
      function restoreSession() {
        const saved = loadSession();
        if (!saved || !saved.roomCode || !saved.participantId) return;
        Object.assign(session, saved);
        if (session.submitted) {
          showWaitScreen();
        } else {
          showLobby();
        }
      }

      // 초기 렌더
      setLang("ko");
      restoreSession();
    </script>
  </body>
</html>
